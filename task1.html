<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Registration Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }
        
        .form-container {
            max-width: 800px;
            margin: 40px auto;
            background-color: #ffffff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .form-header h1 {
            color: #000000;
            margin: 0;
            font-size: 2.2em;
            font-weight: 600;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333333;
            font-weight: 600;
        }
        
        input[type="text"],
        input[type="tel"],
        input[type="email"],
        select,
        textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #cccccc;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
            margin-top: 5px;
        }
        
        textarea {
            height: 100px;
            resize: vertical;
        }
        
        .radio-group {
            display: flex;
            gap: 25px;
            margin-top: 10px;
        }
        
        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23333333' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1em;
        }
        
        .submit-btn {
            background-color: #000000;
            color: white;
            padding: 14px 35px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: block;
            margin: 30px auto 0;
            position: relative;
        }
        
        .submit-btn:hover {
            background-color: #007BFF;
            /* Bright blue color */
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
            letter-spacing: 0.5px;
        }
        
        .required::after {
            content: "*";
            color: #d32f2f;
            margin-left: 3px;
        }
    </style>
</head>

<body>
    <div class="form-container">
        <div class="form-header">
            <h1>Employee Registration</h1>
        </div>

        <form>
            <!-- Full Name -->
            <div class="form-group">
                <label class="required" for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
            </div>

            <!-- Contact Number -->
            <div class="form-group">
                <label class="required" for="phone">Contact Number</label>
                <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" placeholder="Enter 10-digit phone number" required>
            </div>

            <!-- Address -->
            <div class="form-group">
                <label class="required" for="address">Address</label>
                <textarea id="address" name="address" placeholder="Enter your complete address" required></textarea>
            </div>

            <!-- Company Name -->
            <div class="form-group">
                <label class="required" for="company">Company Name</label>
                <input type="text" id="company" name="company" placeholder="Enter company name" required>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label class="required" for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter official email address" required>
            </div>

            <!-- Department -->
            <div class="form-group">
                <label class="required" for="department">Department</label>
                <select id="department" name="department" required>
                    <option value="">Select Department</option>
                    <option value="HR">HR</option>
                    <option value="Sales">Sales</option>
                    <option value="Development">Development</option>
                    <option value="Marketing">Marketing</option>
                    <option value="Others">Others</option>
                </select>
            </div>

            <!-- Gender -->
            <div class="form-group">
                <label class="required">Gender</label>
                <div class="radio-group">
                    <div class="radio-option">
                        <input type="radio" id="male" name="gender" value="male" required>
                        <label for="male">Male</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="female" name="gender" value="female">
                        <label for="female">Female</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="no-say" name="gender" value="no-say">
                        <label for="no-say">Prefer not to say</label>
                    </div>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="submit-btn">Submit Form</button>
        </form>
    </div>
</body>

</html>
